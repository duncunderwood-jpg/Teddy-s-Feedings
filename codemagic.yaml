# Teddy's Feedings: FREE iOS cloud compile and sideloading build.
# Use the ios-free-ipa workflow on Codemagic's free individual macOS M2 plan.
# Produces an unsigned IPA for Sideloadly/AltStore on Windows (NOT TestFlight).
# Free Apple account signs the app on Windows; reinstall / refresh within 7 days.
workflows:
  ios-free-ipa:
    name: FREE - Build iPhone IPA (unsigned, for Sideloadly)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Extract source project
        script: unzip -q "$CM_BUILD_DIR/TeddysFeedings-Free-Cloud-Build.zip" -d "$CM_BUILD_DIR/source"
      - name: Test natural speech parsing
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/source/TeddysFeedings"
          swiftc TeddysFeedings/Models.swift TeddysFeedings/SpokenFeedingParser.swift Tests/ParserSmokeTests.swift -o /tmp/teddy-parser-tests
          /tmp/teddy-parser-tests
      - name: Build Teddy's Feedings for a real iPhone without signing
        script: |
          set -euo pipefail
          xcodebuild \
            -project "$CM_BUILD_DIR/source/TeddysFeedings/TeddysFeedings.xcodeproj" \
            -scheme TeddysFeedings \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build/derived" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA for signing on Windows
        script: |
          set -euo pipefail
          APP="$CM_BUILD_DIR/build/derived/Build/Products/Release-iphoneos/TeddysFeedings.app"
          test -d "$APP"
          mkdir -p "$CM_BUILD_DIR/artifacts/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/artifacts/Payload/"
          cd "$CM_BUILD_DIR/artifacts"
          zip -qry Teddy-Feedings-unsigned.ipa Payload
          test -s Teddy-Feedings-unsigned.ipa
      - name: Review changed feeding flows in simulator
        script: |
          set -euo pipefail
          xcodebuild -project "$CM_BUILD_DIR/source/TeddysFeedings/TeddysFeedings.xcodeproj" -scheme TeddysFeedings -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$CM_BUILD_DIR/build/simulator" CODE_SIGNING_ALLOWED=NO build > /tmp/teddy-simulator-build.log 2>&1
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in sorted(d.items(),reverse=True) if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$CM_BUILD_DIR/build/simulator/Build/Products/Debug-iphonesimulator/TeddysFeedings.app"
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --batteryState charged --batteryLevel 100
          mkdir -p "$CM_BUILD_DIR/artifacts/screenshots"
          xcrun simctl ui "$DEVICE" appearance light
          for TAB in 0 1 3; do
            xcrun simctl terminate "$DEVICE" com.teddyfamily.teddysfeedings || true
            xcrun simctl launch "$DEVICE" com.teddyfamily.teddysfeedings --review-demo --screenshot-tab "$TAB"
            sleep 2
            xcrun simctl io "$DEVICE" screenshot "$CM_BUILD_DIR/artifacts/screenshots/tab$TAB.png"
          done
          for SCREEN in reminder editor; do
            xcrun simctl terminate "$DEVICE" com.teddyfamily.teddysfeedings || true
            xcrun simctl launch "$DEVICE" com.teddyfamily.teddysfeedings --review-demo "--screenshot-$SCREEN"
            sleep 2
            xcrun simctl io "$DEVICE" screenshot "$CM_BUILD_DIR/artifacts/screenshots/$SCREEN.png"
          done
          cd "$CM_BUILD_DIR/artifacts"
          zip -qry Teddy-v1.5-Simulator-Review.zip screenshots
    artifacts:
      - artifacts/Teddy-Feedings-unsigned.ipa
      - artifacts/Teddy-v1.5-Simulator-Review.zip
      - /tmp/teddy-simulator-build.log
      - /tmp/xcodebuild_logs/*.log
